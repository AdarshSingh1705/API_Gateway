spring.application.name=api-management-service
server.port=8081

info.app.name=API Management Service
info.app.description=Management Service for users, routes and gateway policies

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gatekeeper_management}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.placeholders.platformAdminPasswordHash=${PLATFORM_ADMIN_PASSWORD_HASH}
spring.flyway.placeholders.gatewayServicePasswordHash=${GATEWAY_SERVICE_PASSWORD_HASH}

security.jwt.expiration-seconds=3600
security.jwt.secret=${JWT_SECRET}
